const csvCell=v=>{const s=v==null?'':String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(text){const rows=[];let row=[],cell='',q=false;text=text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}return rows.filter(r=>r.some(x=>String(x).trim()!==''));}
async function saveFile(filename,data,type){

  try{await DL.save({filename,data});toast('Saved '+filename);}
  catch(err){const c=err&&err.code;toast(c==='declined'?'Download cancelled.':c==='rate_limited'?'A save prompt is already open.':'This file could not be saved here.');}}

  if(k==='backup'){const data={exported:new Date().toISOString(),settings:SET,menuCategories:MENU_CATS,stockCategories:INV_CATS,

const findIng=s=>{const t=String(s||'').trim().toLowerCase();return ING().find(g=>g.type==='raw'&&(g.name.toLowerCase()===t||g.id===t));};
function checkRows(type,rows){const T=IMPORTS[type];

  return rows.map(c=>{c=c.map(x=>String(x).trim());const r={cells:c,ok:false,msg:''};
    if(type==='expenses'){const dt=/^\d{4}-\d{2}-\d{2}$/.test(c[0])?new Date(c[0]+'T12:00:00'):null;const a=parseFloat(c[3]);
      if(!dt||isNaN(dt))r.msg='Date must be YYYY-MM-DD';else if(!c[2])r.msg='Description missing';else if(!(a>0))r.msg='Amount must be above 0';else{r.ok=true;r.msg='Will add';r.data={date:dt,cat:c[1]||'Other',desc:c[2],amount:a};}}
    if(type==='prices'){const g=findIng(c[0]);const p=parseFloat(c[1]);
      if(!g)r.msg='Ingredient not found';else if(!(p>0))r.msg='Price must be above 0';else{r.ok=true;r.msg=`${money(g.last,2)} to ${money(p,2)} per ${g.buy.label}`;r.data={g,p};}}
    if(type==='stock'){const g=ING().find(x=>x.name.toLowerCase()===String(c[0]).toLowerCase()||x.id===c[0]);const n=parseFloat(c[1]);const u=(c[2]||'').toLowerCase();

    if(type==='menu'){const p=parseFloat(c[2]);const ex=MENU().find(m=>m.name.toLowerCase()===String(c[0]).toLowerCase());
      if(!c[0])r.msg='Name missing';else if(!(p>0))r.msg='Price must be above 0';else{r.ok=true;r.data={name:c[0],cat:c[1],price:p,ex};r.msg=ex?`Update price ${money(ex.price)} to ${money(p)}`:'New dish, needs a recipe';}}

function settingsChange(st,t){const id=t.dataset.id;const v=t.value;const num=parseFloat(v);const A=(a,d,b,c)=>audit(a,d,{before:String(b),after:String(c)});

  if(st==='address'){A('Address changed','Restaurant',SET.address,v.trim());SET.address=v.trim();}
  if(st==='mname'&&v.trim()){A('Dish renamed',MI[id].name,MI[id].name,v.trim());MI[id].name=v.trim();}
  if(st==='mcat'){A('Dish category changed',MI[id].name,MI[id].cat,v);MI[id].cat=v;}
  if(st==='mstation'){A('Dish station changed',MI[id].name,MI[id].station,v);MI[id].station=v;}

  if(st==='mavail'){A(t.checked?'Dish back on sale':'Dish marked sold out',MI[id].name,MI[id].avail?'On sale':'Sold out',t.checked?'On sale':'Sold out');MI[id].avail=t.checked;}
  if(st==='iprice'&&num>0){const g=I[id];A('Ingredient price set by owner',g.name,money(g.last,2),money(num,2));g.last=num;g.avg=num;g.hist.push({date:new Date(),price:num,src:'Owner override'});toast(`${g.name} price set to ${money(num,2)} per ${g.buy.label}.`);}
  if(st==='isup'){A('Supplier changed',I[id].name,I[id].sup,v.trim());I[id].sup=v.trim();}
  if(st==='ilead'&&num>=0)I[id].lead=Math.round(num);
  if(st==='itsp'){A('Teaspoon weight changed',I[id].name,I[id].tsp,num>0?num:0);I[id].tsp=num>0?num:0;}

  if(st==='matrix'){const r=ROLES[t.dataset.r],a=t.dataset.a;A(t.checked?'Access granted':'Access removed',`${r.name}: ${APPNAME[a]}`,t.checked?'No':'Yes',t.checked?'Yes':'No');if(t.checked&&!r.apps.includes(a))r.apps.push(a);if(!t.checked)r.apps=r.apps.filter(x=>x!==a);}

  if(st==='srole'){const x=STAFF[+t.dataset.i];A('Staff role changed',x.name,ROLES[x.role].name,ROLES[v].name);x.role=v;}

  case 'poclose':{const p=S.pos.find(x=>x.no===id);p.status='Closed';poLog(p,'Closed, invoice paid');audit('PO closed',`${p.no}, ${p.sup}`,{after:money(poTotal(p))});render();poModal(id);break;}
  case 'pocancel':{const p=S.pos.find(x=>x.no===id);p.status='Cancelled';poLog(p,'Cancelled');audit('PO cancelled',`${p.no}, ${p.sup}`);render();poModal(id);break;}
  case 'npoadd':{const iid=$('#npoItem').value,q=parseFloat($('#npoQty').value),pv=$('#npoPrice').value;if(!(q>0)){$('#npoErr').textContent='Enter a quantity above zero.';break;}
    const pr=pv===''?quoteOf(iid,S.npo.sup):parseFloat(pv);if(!(pr>=0)){$('#npoErr').textContent='Enter a valid price.';break;}S.npo.lines.push([iid,q,pr]);render();break;}
  case 'npodel':S.npo.lines.splice(+t.dataset.k,1);render();break;
  case 'nposave':{const p=newPO(S.npo.sup,S.npo.lines,'Draft');audit('PO created',`${p.no}, ${p.sup}`,{after:money(poTotal(p))});S.npo={sup:S.npo.sup,lines:[]};render();toast(`${p.no} saved as a draft.`);break;}
  case 'supp':suppModal(id);break;
  case 'plancreate':{const rows=planRows().filter(x=>S.plan&&S.plan[x.g.id]);if(!rows.length){toast('Tick at least one item.');break;}const by={};rows.forEach(x=>{(by[x.g.sup]=by[x.g.sup]||[]).push([x.g.id,x.rec,quoteOf(x.g.id,x.g.sup)]);});
    const made=Object.entries(by).map(([sup,ls])=>{const p=newPO(sup,ls,'Draft');audit('PO drafted from forecast',`${p.no}, ${sup}`,{after:money(poTotal(p))});return p.no;});S.plan=null;S.puTab='po';go('restock');toast(`${made.length} draft purchase order${made.length>1?'s':''} created.`);break;}
  case 'alerts':alertsModal();break;
  case 'alertgo':{const x=S.alertList[+t.dataset.i];closeModal();if(!x)break;if(x.po){S.puTab='po';go('restock');poModal(x.po);}else if(x.id){go(can('inv')?'inv':'kitchen');itemModal(x.id);}else{if(x.go==='forecast')S.fTab='forecast';go(x.go);}break;}
  case 'addstation':{const v=$('#nc_station').value.trim();if(!v){toast('Enter a station name.');break;}if(STATIONS.some(x=>x.toLowerCase()===v.toLowerCase())){toast('That station already exists.');break;}STATIONS.push(v);audit('Station added',v);render();break;}
  case 'delstation':{const x=STATIONS.splice(+t.dataset.i,1)[0];audit('Station removed',x);if(S.kStation===x)S.kStation='All';render();break;}
  default:if(t.dataset.go)go(t.dataset.go);
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='invQ'){S.invQ=t.value;$('#invBody').innerHTML=invRows();return;}
  if(t.id==='rsQty'||t.id==='rsPrice'||t.id==='rsSup'){S.rs[t.id==='rsQty'?'qty':t.id==='rsPrice'?'price':'sup']=t.value;$('#calc').innerHTML=calcHTML();const er=$('#rsErr');if(er)er.textContent='';return;}
  if(t.id==='cookN'){const n=parseInt(t.value,10);const g=I[$('[data-act="cooksave"]').dataset.id];$('#cookTbl').innerHTML=cookTbl(g,n>=1?n:1);if(n>=1)$('#cookOut').value=trim(g.batch.yield*n/1000);return;}
  if(t.id==='pmCash'){S.pm.cash=t.value;const tt=totals(curOrder()).total;const c=parseFloat(t.value);$('#pmRest').innerHTML=c>0&&c<tt?`${esc(S.pm.other)} pays <b>${m2(tt-c)}</b>.`:'Enter the cash part. It must be less than the total.';return;}
  if(t.id==='pmTend'){S.pm.tendered=t.value;const o=curOrder();const tt=totals(o).total;const v=parseFloat(t.value);$('#pmChange').innerHTML=v>=tt?`Change to give: <b>${m2(v-tt)}</b>`:'Enter the cash received to see the change.';return;}
  if(t.id==='shCount'){const v=parseFloat(t.value);const c=shiftCash();$('#shDiff').innerHTML=v>=0?(Math.abs(v-c.expected)<0.01?'Cash matches.':`Cash is ${v>c.expected?'over':'short'} by <b>${m2(Math.abs(v-c.expected))}</b>.`):'';return;}
  if(t.id==='mdNote'&&S.md){S.md.note=t.value;return;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.st){settingsChange(t.dataset.st,t);return;}
  if(t.id==='rsItem'){S.rs={item:t.value,qty:S.rs.qty,price:'',sup:''};render();return;}
  if(t.id==='chan'){curOrder().channel=t.value;render();return;}
  if(t.id==='ctable'){S.ctable=+t.value;render();return;}
  if(t.classList.contains('rq')){const v=parseFloat(t.value);const m=MI[S.recSel];const ln=m[t.dataset.kind||'lines'][+t.dataset.k];if(v>=0){audit('Recipe changed',m.name,{before:`${nice(ln[1])} ${ln[2]} ${I[ln[0]].name}`,after:`${nice(v)} ${ln[2]} ${I[ln[0]].name}`});ln[1]=v;render();}return;}
  if(t.classList.contains('ru')){const m=MI[S.recSel];const ln=m[t.dataset.kind||'lines'][+t.dataset.k];audit('Recipe changed',m.name,{before:`${nice(ln[1])} ${ln[2]} ${I[ln[0]].name}`,after:`${nice(ln[1])} ${t.value} ${I[ln[0]].name}`});ln[2]=t.value;render();return;}
  if(t.id==='mwaste'){const v=parseFloat(t.value);if(v>=0&&v<=50){const m=MI[S.recSel];audit('Expected waste changed',m.name,{before:(m.waste||0)+'%',after:v+'%'});m.waste=v;render();}return;}
  if(t.id==='npoSup'){S.npo.sup=t.value;render();return;}
  if(t.classList.contains('planck')){if(!S.plan)S.plan={};S.plan[t.dataset.id]=t.checked;return;}
  if(t.id==='pmOther'){S.pm.other=t.value;payModal();return;}
  if(t.id==='mprice'){const v=parseFloat(t.value);if(v>0){const m=MI[S.recSel];audit('Menu price changed',m.name,{before:money(m.price),after:money(v)});m.price=v;render();}return;}
  if(t.id==='impFile'&&t.files&&t.files[0]){const f=t.files[0];const rd=new FileReader();rd.onload=()=>{S.imp.rows=checkRows(S.imp.type,parseCSV(String(rd.result)));S.imp.file=f.name;render();};rd.onerror=()=>toast('That file could not be read.');rd.readAsText(f);return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if(e.key==='Enter'&&e.target.id==='apPin')apOk();});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

render();
(function(){const m=location.hash.match(/^#t=(\d+)$/);if(!m)return;const b=document.querySelector('[data-act=login][data-r=customer]');if(b){b.click();S.ctable=Math.min(+m[1],SET.tables);render();}})();
})();
</script>
</body>
</html>

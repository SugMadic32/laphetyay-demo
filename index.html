<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaPhetYay: restaurant POS and ERP demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EE;--surface:#FFFFFF;--ink:#16201B;--muted:#5B6A62;--line:#D6DED8;
  --side:#173326;--side-ink:#DCEBE2;--side-muted:#8FB3A0;--side-accent:#8FD3AE;
  --basil:#2B6A4A;--basil-ink:#FFFFFF;--tint:#E2EFE6;
  --chili:#B8321B;--chili-tint:#F8E3DE;--turmeric:#9A6A04;--turmeric-tint:#FBF0D5;
  --ticket:#FFFDF6;--bar:#2B6A4A;--bar2:#A9CDB8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1713;--surface:#16211B;--ink:#E5EEE8;--muted:#9AB0A3;--line:#2A3A31;
    --side:#0B120E;--side-ink:#DCEBE2;--side-muted:#7FA08D;--side-accent:#6FD39A;
    --basil:#5FB487;--basil-ink:#0B120E;--tint:#1E3328;
    --chili:#F07A62;--chili-tint:#3A1C16;--turmeric:#E7B23C;--turmeric-tint:#3A2E10;
    --ticket:#1B261F;--bar:#5FB487;--bar2:#2F5A43;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1713;--surface:#16211B;--ink:#E5EEE8;--muted:#9AB0A3;--line:#2A3A31;
  --side:#0B120E;--side-ink:#DCEBE2;--side-muted:#7FA08D;--side-accent:#6FD39A;
  --basil:#5FB487;--basil-ink:#0B120E;--tint:#1E3328;
  --chili:#F07A62;--chili-tint:#3A1C16;--turmeric:#E7B23C;--turmeric-tint:#3A2E10;
  --ticket:#1B261F;--bar:#5FB487;--bar2:#2F5A43;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 2px;font-weight:700}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px;max-width:72ch}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.logo{width:36px;height:36px;flex:none;border-radius:10px;background:var(--side-accent);color:var(--side);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.brand b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;line-height:1.2}
.brand small{color:var(--side-muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;color:var(--side-ink);cursor:pointer;font-weight:500}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--side-accent)}
nav .tile-ico{border-radius:8px;box-shadow:none}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:var(--side-muted)}
.who b{display:block;color:var(--side-ink);font-size:14px}
.who .row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--side-ink);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
main{padding:28px 32px 56px;min-width:0;max-width:1280px;width:100%}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.vh h1{display:flex;align-items:center;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px}
.kpis>div{padding:16px 20px;border-left:1px solid var(--line);min-width:0}
.kpis>div:first-child{border-left:0}
.kpis span{display:block;color:var(--muted);font-size:13px}
.kpis strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:28px;line-height:1.15;font-weight:700;white-space:nowrap}
.kpis em{font-style:normal;color:var(--muted);font-size:13px}
.kpis .hero strong{font-size:40px;color:var(--basil)}
.btn{background:var(--basil);color:var(--basil-ink);border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--chili);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
td small{display:block;color:var(--muted);font-size:12.5px}
tr.click{cursor:pointer}
tr.click:hover td,tr.sel td{background:var(--tint)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--tint);color:var(--basil)}
.tag.bad{background:var(--chili-tint);color:var(--chili)}
.tag.warn{background:var(--turmeric-tint);color:var(--turmeric)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.ticket{background:var(--ticket);border-style:dashed;border-width:1.5px}
.feed{max-height:430px;overflow:auto;margin-top:8px}
.entry{padding:10px 0;border-top:1px dashed var(--line)}
.entry:first-child{border-top:0}
.entry.new{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--tint)}to{background:transparent}}
.entry .hd{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.entry .hd small{color:var(--muted);font-weight:400;margin-right:6px}
.entry .meta{color:var(--muted);font-size:13px}
.entry ul{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:20px;font-size:13px;color:var(--muted)}
.entry li{break-inside:avoid;display:flex;justify-content:space-between;gap:8px}
.entry li b{color:var(--ink);font-weight:500}
.empty{color:var(--muted);padding:14px 0;margin:0}
.stmt td{padding:7px 4px}
.stmt tr.sum td{font-weight:700;border-top:1.5px solid var(--ink)}
.stmt tr.ind td:first-child{padding-left:18px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;background:var(--chili-tint);color:var(--chili);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:600}
.banner span{flex:1}
.banner.info{background:var(--turmeric-tint);color:var(--turmeric)}
.poshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;min-height:60px;display:flex;flex-direction:column;justify-content:space-between}
.tbtn b{font-weight:600}
.tbtn small{color:var(--muted);font-size:12px}
.tbtn.busy{background:var(--tint);border-color:var(--basil)}
.tbtn.on{box-shadow:inset 0 0 0 2px var(--ink)}
.tbtn.ask{border-color:var(--chili);background:var(--chili-tint)}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dish{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.dish:hover:not(:disabled){border-color:var(--basil)}
.dish:disabled{opacity:.55;cursor:not-allowed}
.dish .top{display:flex;gap:10px;align-items:flex-start}
.dish b{font-weight:600;line-height:1.3}
.dish .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dish .price{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.cline{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.cline .nm{flex:1;min-width:0}
.cline .nm small{display:block;color:var(--muted);font-size:12.5px}
.cline .nm .lnote{color:var(--turmeric)}
.cline.voided .nm>span{text-decoration:line-through;color:var(--muted)}
.cline .amt{white-space:nowrap;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tot{margin:12px 0;font-size:14px}
.tot .r{display:flex;justify-content:space-between;padding:2px 0}
.tot .big{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:700;padding-top:6px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.uses{font-size:13px;color:var(--muted);margin-top:14px}
.uses summary{cursor:pointer;color:var(--ink);font-weight:600}
.uses ul{list-style:none;padding:0;margin:8px 0 0;max-height:200px;overflow:auto}
.uses li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.form{display:grid;gap:12px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:end}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px}
input[type=number],input[type=text],input[type=search],input[type=date],input[type=password],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
td input[type=number],td input[type=text],td select{padding:5px 8px}
.w90{width:90px!important}.w70{width:70px!important}.w140{width:140px!important}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.steps>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.steps>li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--basil);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps .t{font-weight:600}
.steps .w{color:var(--muted);font-size:13.5px}
.steps .w b{color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.note{background:var(--tint);border-radius:12px;padding:14px 16px;font-size:14px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13px;color:var(--muted)}
.stage.on{border-color:var(--basil);box-shadow:inset 0 0 0 1px var(--basil)}
.stage b{display:block;font-size:14px;color:var(--ink)}
.minis{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 16px}
.minis div span{display:block;color:var(--muted);font-size:13px}
.minis div strong{font-family:'Bricolage Grotesque',sans-serif;font-size:24px}
.reclist button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;gap:8px}
.reclist button.on{background:var(--tint)}
.reclist button small{color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:12px}
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:200px}
.kcol h2{display:flex;justify-content:space-between}
.kt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.kt.late{border-color:var(--chili);box-shadow:inset 3px 0 0 var(--chili)}
.kt .hd{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.kt .hd small{font-weight:500;color:var(--muted)}
.kt.late .hd small{color:var(--chili)}
.kt ul{list-style:none;margin:8px 0 10px;padding:0;font-size:14px}
.kt li{padding:3px 0}
.kt li small{display:block;color:var(--muted)}
.kt li .kn{display:inline-block;margin-top:2px;background:var(--turmeric-tint);color:var(--turmeric);border-radius:6px;padding:1px 6px;font-size:12.5px}
.kt li.v{text-decoration:line-through;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rcard{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.rcard:hover{border-color:var(--basil)}
.rcard b{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;display:block}
.rcard small{color:var(--muted)}
.rcard p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{display:block}
.tile-ico{background:#fff;border-radius:24%;box-shadow:0 1px 2px rgba(20,40,30,.10),0 6px 16px rgba(20,40,30,.08)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 14px;margin-top:6px;max-width:960px}
.app-t{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 6px;border-radius:16px;text-align:center}
.app-t .tile-ico{transition:transform .15s ease}
.app-t:hover .tile-ico{transform:translateY(-3px)}
.app-t b{font-weight:600;font-size:15.5px}
.app-t small{color:var(--muted);font-size:12.5px;margin-top:-6px}
.nm-i{display:flex;align-items:center;gap:10px}
.optgrp{margin:14px 0 0}
.optgrp h3{font-family:'Public Sans',sans-serif;font-size:13px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);cursor:pointer;font-size:14px}
.opt.on{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
.receipt{font-size:13.5px;background:var(--ticket);border:1px dashed var(--line);border-radius:10px;padding:16px}
.receipt .r{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.receipt small{color:var(--muted)}
/* */.qr{display:grid;place-items:center;gap:6px;padding:10px;background:#fff;border-radius:10px;color:#16201B;font-size:12.5px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.5);display:grid;place-items:center;padding:16px;z-index:40}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:14px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}
.mbox.wide{width:min(720px,100%)}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90%}
.toast[hidden]{display:none}
.neg{color:var(--chili)}
.posv{color:var(--basil)}
.muted{color:var(--muted)}
.err{color:var(--chili);font-size:13px;margin:0;min-height:1em}
.matrix td.c input{width:18px;height:18px}
svg text{font-family:'Public Sans',system-ui,sans-serif}
.chart{width:100%;height:auto;display:block}
body.cust .app{grid-template-columns:1fr}
body.cust .side{display:none}
body.cust main{max-width:760px;margin:0 auto;padding-bottom:120px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cdish{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.cdish .nm{flex:1}
.cdish .nm small{display:block;color:var(--muted)}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(728px,calc(100% - 24px));background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:30}
.cbar span{flex:1}
.cbar .btn{background:var(--side-accent);color:var(--side)}
.status-steps{display:flex;gap:6px;flex-wrap:wrap}
.ktabs{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.bell{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:0;color:var(--side-ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;margin-top:8px}
.bell b{background:var(--chili);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.bars .row{display:grid;grid-template-columns:150px minmax(0,1fr) 84px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bars .track{display:block;height:12px;background:var(--tint);border-radius:6px;overflow:hidden}
.bars .fill{display:block;height:100%;background:var(--bar);border-radius:6px}
@media (max-width:1100px){.ktabs{display:flex}.kds.t-new .kcol:not(.k-new),.kds.t-cooking .kcol:not(.k-cooking),.kds.t-ready .kcol:not(.k-ready){display:none}}
@media (max-width:760px){.bars .row{grid-template-columns:100px minmax(0,1fr) 70px}.bell{margin:0}}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qrcard{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:#fff}
.qrcard svg{width:140px;height:140px}
.invoice{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fff;font-size:14px}
.offbar{background:var(--chili-tint,#FBE6E1);border:1px solid #F0B8AC}
/* logo */
.logo{background:#fff!important;padding:2px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.brandhero{text-align:center;margin:0 0 6px}
.brandhero img{width:170px;height:170px;object-fit:contain;border-radius:18px;background:#fff}
/* dashboard panels: minimize / maximize */
.fold-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fold-btns{display:flex;gap:4px;flex:none}
.fold-b{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:16px;line-height:1;color:var(--ink);font-family:inherit}
.fold-b:hover{background:var(--tint)}
.panel.folded>*:not(h2){display:none}
.panel.folded{padding-bottom:12px;align-self:start}
/* payment share bar */
.pbar{display:inline-block;width:90px;height:8px;background:var(--tint);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--bar)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){
  .pos{grid-template-columns:1fr}.cart{position:static}
  .grid2,.split{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis>div:nth-child(3){border-left:0}
  .kpis>div:nth-child(n+3){border-top:1px solid var(--line)}
  .kds{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;height:auto;padding:10px 12px;gap:12px;overflow-x:auto;z-index:10}
  .brand{padding:0}.brand div{display:none}
  nav{flex-direction:row}
  nav button{white-space:nowrap}
  nav button.on{box-shadow:inset 0 -3px 0 var(--side-accent)}
  .who{margin:0;padding:0 0 0 10px;border:0;white-space:nowrap}
  .who .lbl{display:none}
  main{padding:20px 14px 48px}
  h1{font-size:26px}
  .entry ul{columns:1}
  .stages{grid-template-columns:1fr}
  .kpis strong{font-size:22px}.kpis .hero strong{font-size:28px}
  .kpis>div{padding:12px 14px}
}
/* LaPhetYay theme: fixed colours taken from the logo (tea orange, dark brown, cream). Same in light and dark mode. */
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){
  color-scheme:light;
  --bg:#F8F1E7;--surface:#FFFDF9;--ink:#2E1D12;--muted:#7A6150;--line:#E7D9C6;
  --side:#3E2716;--side-ink:#F7E9D8;--side-muted:#C9A98A;--side-accent:#F0A04B;
  --basil:#B85A0D;--basil-ink:#FFFFFF;--tint:#FBE9D4;
  --chili:#B8321B;--chili-tint:#F8E3DE;--turmeric:#8A5A00;--turmeric-tint:#FBEFD6;
  --ticket:#FFF9EE;--bar:#E07A16;--bar2:#F3C99A;
}
/* clean look: no instruction text on pages */
#rname{display:none}
header.vh p.sub,header.vh .sub,section.panel>p.sub:not(.keep),.note{display:none!important}

const hasOptions=m=>hasSpice(m)||hasSweet(m)||hasIce(m)||extrasFor(m).length||removablesFor(m).length;
function defMods(m){const o={extras:[],remove:[]};if(hasSpice(m))o.spice=1;if(hasSweet(m))o.sweet=1;if(hasIce(m))o.ice=0;return o;}
function linePrice(l){return MI[l.mid].price+sum(l.mods.extras||[],x=>{const e=EXTRAS.find(e=>e.id===x);return e?e.price:0;});}
function modsText(l){const p=[],o=l.mods;if(o.spice!=null)p.push(SPICE[o.spice]);if(o.sweet!=null&&o.sweet!==1)p.push(SWEET[o.sweet]);if(o.ice!=null&&o.ice!==0)p.push(ICE[o.ice]);
  (o.extras||[]).forEach(x=>{const e=EXTRAS.find(e=>e.id===x);if(e)p.push('+ '+e.name);});(o.remove||[]).forEach(i=>p.push('No '+(I[i]?I[i].name.split(',')[0].toLowerCase():i)));return p.join(', ');}
function lineRecipe(l,o){const m=MI[l.mid];const rm=l.mods.remove||[];const f=l.mods.sweet==null?1:[0.5,1,1.5][l.mods.sweet];
  let out=m.lines.filter(([i])=>!rm.includes(i)).map(([i,q,u])=>[i,(i==='sugar'||i==='condmilk')?q*f:q,u]);
  for(const x of (l.mods.extras||[])){const e=EXTRAS.find(e=>e.id===x);if(e)out=out.concat(e.lines);}if(o&&o.type!=='dine')out=out.concat(m.pack||[]);return out;}

  if(o.disc)disc=o.disc.type==='pct'?sub*o.disc.val/100:Math.min(o.disc.val,sub);disc=r2(disc);
  const after=sub-disc,svc=r2(after*SET.service/100),base=after+svc;let vat,total;

function deductionLines(entries){
  const agg={};
  for(const {lines,qty} of entries)for(const [i,lq,u] of lines){const b=toBase(I[i],lq,u)*qty;const a=agg[i]||(agg[i]={base:0,u,q:0,mixed:false});a.base+=b;if(a.u!==u)a.mixed=true;a.q+=lq*qty;}
  return Object.entries(agg).map(([id,a])=>{const g=I[id];const spoon=(a.u==='tsp'||a.u==='tbsp')&&!a.mixed;return {id,base:a.base,text:spoon?`${nice(a.q)} ${a.u} (${fmtBase(g,a.base)})`:fmtBase(g,a.base)};});
}
function pushFeed(e){e.id=S.eid++;S.feed.unshift(e);if(S.feed.length>40)S.feed.pop();S.flash=e.id;}
function sendKitchen(o,silent){
  const ls=o.lines.filter(l=>!l.sent&&!l.void);if(!ls.length)return 0;
  const ded=deductionLines(ls.map(l=>({lines:lineRecipe(l,o),qty:l.qty})));
  for(const d of ded)move(d.id,-d.base,'POS',orderLabel(o));
  const t={id:S.tid++,oid:o.id,at:new Date(),status:'new',held:!!S.offline};S.tickets.push(t);if(S.offline)o.offline=true;
  ls.forEach(l=>{l.sent=true;l.tid=t.id;l.cost=lineCost(l,o);});
  if(!silent)pushFeed({time:new Date(),title:`${orderLabel(o)} sent to kitchen`,meta:`${sum(ls,l=>l.qty)} items${o.source==='qr'?', ordered by the customer':''}`,lines:ded.map(d=>({name:I[d.id].name,val:'−'+d.text}))});
  return ls.length;
}

function runOut(stock,arr,rem){let s=stock;for(let k=0;k<60;k++){const d=addDays(today,k);const need=(k===0?rem:1)*arr[d.getDay()];if(s<=0)return k;if(need>0&&s<=need)return k+s/need;s-=need;}return Infinity;}
function forecast(id){
  const g=I[id],last=S.hist.slice(-28);const sm=Array(7).fill(0),cnt=Array(7).fill(0),mn=Array(7).fill(Infinity),mxa=Array(7).fill(0);let t=0;
  for(const h of last){const v=h.usage[id]||0;sm[h.dow]+=v;cnt[h.dow]++;t+=v;mn[h.dow]=Math.min(mn[h.dow],v);mxa[h.dow]=Math.max(mxa[h.dow],v);}
  const dow=sm.map((s,i)=>cnt[i]?s/cnt[i]:0),lo=mn.map(v=>isFinite(v)?v:0);const simple=t/last.length;
  const now=new Date();const hr=now.getHours()+now.getMinutes()/60;const rem=Math.max(0,Math.min(1,(21-hr)/11));
  const left=runOut(g.stock,dow,rem),early=runOut(g.stock,mxa,rem),late=runOut(g.stock,lo,rem);
  const next=[];for(let k=0;k<15;k++){const d=addDays(today,k);next.push({d,v:dow[d.getDay()]});}
  let needH=0;for(let k=0;k<=g.lead+7;k++){const d=addDays(today,k);needH+=(k===0?rem:1)*dow[d.getDay()];}
  const next7=sum(next.slice(1,8),x=>x.v)/7;
  const outDate=isFinite(left)?addDays(today,Math.floor(left)):null;
  const eDate=isFinite(early)?addDays(today,Math.floor(early)):null,lDate=isFinite(late)?addDays(today,Math.floor(late)):null;
  const byDate=eDate?addDays(eDate,-g.lead):null;const safety=2*next7;const order=Math.max(0,needH+safety-g.stock);
  const sug=g.type==='pre'?Math.ceil(order/g.batch.yield):Math.ceil(order/g.buy.factor);
  let status=['ok','OK'];
  if(simple===0)status=['plain','No recent use'];
  else if(early<=g.lead+1)status=['bad',g.type==='pre'?'Cook now':'Order now'];
  else if(early<=g.lead+3)status=['warn','Low'];
  return {left,early,late,outDate,eDate,lDate,byDate,next7,simple,sug,status,next,needH,safety};
}

function leftRange(f){if(!isFinite(f.early))return 'Not soon';if(f.early<1&&f.late<1)return 'Today';const a=f.early<1?'0':f.early.toFixed(1);const b=isFinite(f.late)?f.late.toFixed(1):'10+';return a===b?`${a} days`:`${a}–${b} days`;}
const leftText=l=>!isFinite(l)?'Not soon':l<1?'Today':l.toFixed(1)+' days';
function sugText(g,f){if(!f.sug)return '<span class="muted">Nothing yet</span>';if(g.type==='pre')return `Cook ${f.sug} batch${f.sug>1?'es':''}`;return `${f.sug} ${g.buy.label}${g.buy.desc?` <small>${g.buy.desc} each</small>`:''}`;}

const vatOf=t=>t*SET.vat/(100+SET.vat);
const paidToday=()=>S.orders.filter(o=>o.status==='paid');
const refundedToday=()=>S.orders.filter(o=>o.status==='refunded');
function period(days){
  const hs=days>1?S.hist.slice(-(days-1)):[];
  const tSales=sum(paidToday(),o=>tot(o).total),tCost=sum(paidToday().concat(refundedToday()),orderCost)+sum(S.orders.filter(o=>o.status==='open'),orderCost);
  const sales=sum(hs,h=>h.rev)+tSales,cost=sum(hs,h=>h.cost)+tCost;
  const refunds=sum(refundedToday(),o=>tot(o).total),disc=sum(paidToday().concat(refundedToday()),o=>tot(o).disc);
  const vat=vatOf(sales),net=sales-vat,gross=net-cost;const from=addDays(today,-(days-1));
  const fixed=sum(FIXED,f=>f[1])*days/30;const adhoc=sum(S.expenses.filter(e=>e.date>=from),e=>e.amount);
  return {days,from,sales,vat,net,cost,gross,fixed,adhoc,refunds,disc,profit:gross-fixed-adhoc,orders:sum(hs,h=>h.orders)+paidToday().length};
}

VIEWS.home=function(){
  const stat={};
  const rev=sum(paidToday(),o=>tot(o).total);
  stat.dash=seeCost()?`${money(rev)} sold today`:'';
  stat.pos=`${S.orders.filter(o=>o.status==='open').length} open orders`;
  stat.orders=S.shift&&S.shift.open?'Shift open':'No shift open';
  stat.kitchen=`${S.tickets.filter(t=>t.status==='new'||t.status==='cooking').length} tickets cooking or waiting`;
  stat.inv=`${ING().length} items`;
  stat.recipes=`${MENU().length} dishes`;
  stat.restock=`${S.pos.filter(p=>!['Closed','Cancelled'].includes(p.status)).length} open purchase orders`;
  const alerts=ING().filter(g=>g.type==='raw'&&g.hist.length>1&&Math.abs(g.hist[g.hist.length-1].price/g.hist[g.hist.length-2].price-1)>=0.1).length;
  stat.prices=alerts?`${alerts} price alert${alerts>1?'s':''}`:'No price alerts';
  const need=ING().filter(g=>forecast(g.id).status[0]==='bad').length;
  stat.forecast=need?`${need} to order or cook now`:'Nothing urgent';
  stat.accounting='P&L, export, import';stat.ops=`${S.orders.filter(o=>o.status==='open').length} open orders, ${expiring(1).length} batches expiring`;stat.forecast=need?`${need} to order or cook now`:'Forecast, waste, menu';
  stat.settings='Menu, prices, staff';
  return `<header class="vh"><div><h1>${esc(SET.name)}</h1><p class="sub">Signed in as ${esc(S.user)}, ${ROLE().name.toLowerCase()}. These are the apps for your job.</p></div></header>
  <div class="apps">${APPS.slice(1).filter(([v])=>can(v)).map(([v,l])=>`<button class="app-t" data-go="${v}">${ico(v,92,true)}<b>${esc(l)}</b><small>${stat[v]||''}</small></button>`).join('')}</div>`;
};

VIEWS.dash=function(){
  const paid=paidToday();const rev=sum(paid,o=>tot(o).total);const cost=sum(paid,orderCost);
  const gp=rev-vatOf(rev)-cost,fc=rev?cost/(rev-vatOf(rev)):0;
  const stockVal=sum(ING(),g=>Math.max(0,g.stock)*valPerBase(g));
  const low=ING().map(g=>({g,f:forecast(g.id)})).filter(x=>x.f.simple>0).sort((a,b)=>a.f.left-b.f.left).slice(0,7);
  const p=period(30);
  return `
  <header class="vh"><div><h1>Today at a glance</h1><p class="sub">${fmtDay(new Date())}. Numbers change the moment an order is paid, sent to the kitchen, restocked or adjusted.</p></div>${can('pos')?'<button class="btn" data-go="pos">Open POS</button>':''}</header>
  <section class="kpis">
    <div class="hero"><span>Sales today</span><strong>${money(rev)}</strong><em>${paid.length} paid orders, VAT included</em></div>
    <div><span>Food cost today</span><strong>${money(cost)}</strong><em>${pct(fc)} of sales before VAT, target ${SET.target}%</em></div>
    <div><span>Gross profit today</span><strong>${money(gp)}</strong><em>Sales minus VAT and food cost</em></div>
    <div><span>Stock on hand</span><strong>${money(stockVal)}</strong><em>At average cost</em></div>
  </section>
  <div class="grid2">
    <section class="panel"><h2>Sales by hour</h2><p class="sub">Paid orders, today.</p>${hourChart()}</section>
    <section class="panel ticket"><h2>Kitchen ticket</h2><p class="sub">Every ingredient taken from stock, down to the spoon.</p><div class="feed">${feedHTML()}</div></section>
  </div>
  <div class="grid2">
    <section class="panel"><h2>Running out soon</h2><p class="sub">Forecast from the last 4 weeks of use, by weekday.</p>
      <div class="tbl"><table><thead><tr><th>Item</th><th class="n">In stock</th><th>Runs out</th><th>Order or cook by</th><th></th></tr></thead><tbody>
      ${low.map(({g,f})=>`<tr${can('forecast')?` class="click" data-act="fsel" data-id="${g.id}"`:''}><td>${esc(g.name)}</td><td class="n">${fmtBase(g,g.stock)}</td><td>${rangeText(f)}</td><td>${byText(g,f)}</td><td><span class="tag ${f.status[0]}">${f.status[1]}</span></td></tr>`).join('')}
      </tbody></table></div></section>
    <section class="panel"><h2>Profit and loss, last 30 days</h2><p class="sub">${fmtDate(p.from)} to today. Food cost comes from recipes × dishes sold.</p>${pnlTable(p)}</section>
  </div>
  ${payPanel(1,'Payments today by method')}`;
};
/** Money received by payment method (mixed payments count in each part). */
function payTotals(days){const m={};const add=(k,a,c)=>{m[k]=m[k]||{amount:0,count:0};m[k].amount+=a;m[k].count+=c;};
  paidToday().forEach(o=>(o.payments||[]).forEach(p=>add(p.method,p.amount,1)));
  if(days>1)S.hist.slice(-(days-1)).forEach(h=>Object.entries(h.pay||{}).forEach(([k,v])=>add(k,v.amount,v.count)));
  return m;}
function payPanel(days,title){const m=payTotals(days);const order=['Cash','PromptPay QR','Card','Bank transfer'];
  const keys=[...order.filter(k=>m[k]),...Object.keys(m).filter(k=>!order.includes(k))];
  const total=sum(keys,k=>m[k].amount),cash=m.Cash?m.Cash.amount:0,qr=m['PromptPay QR']?m['PromptPay QR'].amount:0;
  return `<section class="panel" style="margin-top:18px"><h2>${title}</h2><p class="sub">Money actually received. Cash should match the drawer; QR, card and transfer should match the bank app and card machine.${days>1?'':''}</p>
  <div class="minis" style="margin-top:10px"><div><span>Cash</span><strong>${money(cash)}</strong></div><div><span>PromptPay QR</span><strong>${money(qr)}</strong></div><div><span>Card and transfer</span><strong>${money(total-cash-qr)}</strong></div><div><span>Total received</span><strong>${money(total)}</strong></div></div>
  <div class="tbl"><table><thead><tr><th>Method</th><th class="n">Payments</th><th class="n">Amount</th><th>Share</th></tr></thead><tbody>
  ${keys.length?keys.map(k=>`<tr><td>${esc(k)}</td><td class="n">${m[k].count.toLocaleString('en-US')}</td><td class="n">${money(m[k].amount)}</td><td><span class="pbar"><i style="width:${total?(m[k].amount/total*100).toFixed(1):0}%"></i></span>${pct(total?m[k].amount/total:0)}</td></tr>`).join('')+`<tr><td><b>Total</b></td><td class="n"><b>${sum(keys,k=>m[k].count).toLocaleString('en-US')}</b></td><td class="n"><b>${money(total)}</b></td><td></td></tr>`:'<tr><td colspan="4"><p class="empty">No payments yet.</p></td></tr>'}
  </tbody></table></div></section>`;}

/* ---------- dashboard: minimize / maximize panels ---------- */
let FOLD={};try{FOLD=JSON.parse(localStorage.getItem('lpy.fold')||'{}')||{};}catch(e){FOLD={};}
function saveFold(){try{localStorage.setItem('lpy.fold',JSON.stringify(FOLD));}catch(e){}}
function foldPanels(){const ps=[...document.querySelectorAll('#main section.panel')].filter(p=>p.querySelector(':scope>h2'));
  ps.forEach(p=>{const h=p.querySelector(':scope>h2');const k=h.textContent.trim().replace(/,.*$/,'');p.dataset.fk=k;h.classList.add('fold-h');
    h.insertAdjacentHTML('beforeend',`<span class="fold-btns"><button class="fold-b" data-act="pmax" data-k="${esc(k)}" title="Maximize" aria-label="Maximize ${esc(k)}">⤢</button><button class="fold-b" data-act="pfold" data-k="${esc(k)}" title="${FOLD[k]?'Show':'Minimize'}" aria-label="${FOLD[k]?'Show':'Minimize'} ${esc(k)}">${FOLD[k]?'+':'–'}</button></span>`);
    if(FOLD[k])p.classList.add('folded');});
  const hd=document.querySelector('#main header.vh');
  if(hd&&ps.length)hd.insertAdjacentHTML('beforeend',`<div class="btnrow"><button class="btn ghost sm" data-act="foldall">Minimize all</button><button class="btn ghost sm" data-act="unfoldall">Show all</button></div>`);}

function pnlTable(p){
  return `<table class="stmt"><tbody>
    <tr><td>Gross sales</td><td class="n">${money(p.sales+p.disc+p.refunds)}</td></tr>
    <tr class="ind"><td>Discounts</td><td class="n">${money(-p.disc)}</td></tr>
    <tr class="ind"><td>Refunds</td><td class="n">${money(-p.refunds)}</td></tr>
    <tr class="ind"><td>VAT ${SET.vat}%</td><td class="n">${money(-p.vat)}</td></tr>
    <tr><td>Net revenue</td><td class="n">${money(p.net)}</td></tr>
    <tr><td>Food cost <span class="muted">(${SET.basis==='last'?'latest price':'weighted average'})</span></td><td class="n">${money(-p.cost)}</td></tr>
    <tr class="sum"><td>Gross profit <span class="muted">(${pct(p.net?p.gross/p.net:0)} of net revenue)</span></td><td class="n">${money(p.gross)}</td></tr>
    ${FIXED.map(f=>`<tr class="ind"><td>${esc(f[0])}${p.days!==30?` (${p.days} of 30 days)`:''}</td><td class="n">${money(-f[1]*p.days/30)}</td></tr>`).join('')}
    <tr class="ind"><td>Other expenses</td><td class="n">${money(-p.adhoc)}</td></tr>
    <tr class="sum"><td>Operating profit</td><td class="n ${p.profit<0?'neg':'posv'}">${money(p.profit)}</td></tr>
  </tbody></table>${p.refunds?`<p class="sub">Refunded food stays in food cost as a loss.</p>`:''}`;
}
function hourChart(){
  const hrs=[];const h0=Math.floor(Math.min(10,DEMO_OPEN));for(let h=h0;h<Math.max(h0+11,21);h++)hrs.push(h);
  const v=hrs.map(h=>sum(paidToday().filter(o=>o.paidAt.getHours()===h),o=>tot(o).total));
  const max=Math.max(1,...v),W=600,H=200,L=6,B=168,bw=(W-L*2)/hrs.length;
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales by hour today">`;
  hrs.forEach((h,i)=>{const bh=v[i]/max*128,x=L+i*bw+5,w=bw-10,cx=x+w/2;
    if(v[i])o+=`<rect x="${x}" y="${B-bh}" width="${w}" height="${bh}" rx="4" fill="var(--bar)"/><text x="${cx}" y="${B-bh-6}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${short(v[i])}</text>`;
    o+=`<text x="${cx}" y="${B+20}" text-anchor="middle" font-size="12" fill="var(--muted)">${h}:00</text>`;});
  return o+`<line x1="${L}" x2="${W-L}" y1="${B}" y2="${B}" stroke="var(--line)"/></svg>`;
}
function feedHTML(){
  if(!S.feed.length)return '<p class="empty">Nothing yet. Send an order to the kitchen from the POS and each ingredient will appear here.</p>';
  return S.feed.map(e=>`<div class="entry${e.id===S.flash?' new':''}"><div class="hd"><span><small>${fmtTime(e.time)}</small>${esc(e.title)}</span>${e.amount!=null&&seeCost()?`<span>${m2(e.amount)}</span>`:''}</div>${e.meta?`<div class="meta">${esc(e.meta)}</div>`:''}<ul>${e.lines.map(l=>`<li><b>${esc(l.name)}</b><span>${esc(l.val)}</span></li>`).join('')}</ul></div>`).join('');
}

VIEWS.ops=function(){
  const open=S.orders.filter(o=>o.status==='open');const k={new:0,cooking:0,ready:0};S.tickets.forEach(t=>{if(k[t.status]!=null)k[t.status]++;});

  const exp=expiring(2);const low=ING().map(g=>({g,f:forecast(g.id)})).filter(x=>x.f.status[0]==='bad');
  const wToday=sum(S.moves.filter(m=>(m.type==='WASTAGE'||m.type==='EXPIRED')&&m.at>=today&&m.delta<0),m=>-m.delta*valPerBase(I[m.id]));

  <div class="grid2"><section class="panel"><h2>Expiring soon</h2><p class="sub">Batches expiring within 2 days. Use these first, or write off what has expired.</p><div class="tbl"><table><thead><tr><th>Item</th><th>Batch</th><th class="n">Quantity</th><th></th></tr></thead><tbody>${exp.length?exp.map(x=>`<tr class="click" data-act="item" data-id="${x.g.id}"><td>${esc(x.g.name)}</td><td>${esc(x.b.no)}</td><td class="n">${fmtBase(x.g,x.b.qty)}</td><td><span class="tag ${x.days<0?'bad':x.days<=1?'warn':'plain'}">${expText(x.days)}</span></td></tr>`).join(''):'<tr><td colspan="4"><p class="empty">Nothing expiring soon.</p></td></tr>'}</tbody></table></div></section>
  <section class="panel"><h2>Purchases in progress</h2><div class="tbl"><table><thead><tr><th>PO</th><th>Supplier</th><th>Expected</th><th>Status</th></tr></thead><tbody>${pend.length?pend.map(p=>`<tr class="click" data-act="po" data-id="${p.no}"><td>${p.no}</td><td>${esc(p.sup)}</td><td>${fmtDay(p.expected)}${lateP(p)?' <span class="tag bad">Late</span>':''}</td><td><span class="tag ${PO_TAG[p.status]}">${p.status}</span></td></tr>`).join(''):'<tr><td colspan="4"><p class="empty">No open purchase orders.</p></td></tr>'}</tbody></table></div></section></div>
  <div class="grid2"><section class="panel"><h2>Orders on the floor</h2><div class="tbl"><table><thead><tr><th>Order</th><th>Opened</th><th class="n">Items</th><th class="n">Total</th></tr></thead><tbody>${open.length?open.map(o=>`<tr${can('pos')?` class="click" data-act="openinpos" data-id="${o.id}"`:''}><td>${esc(orderLabel(o))}${S.requests.some(r=>o.type==='dine'&&r.table===o.table&&r.type==='bill')?' <span class="tag bad">Wants the bill</span>':''}</td><td>${fmtTime(o.created)}</td><td class="n">${totals(o).count}</td><td class="n">${m2(totals(o).total)}</td></tr>`).join(''):'<tr><td colspan="4"><p class="empty">No open orders.</p></td></tr>'}</tbody></table></div></section>

VIEWS.pos=function(){
  S.orders.filter(x=>x.status==='open'&&x.splitFrom&&x.id!==S.cur).forEach(unsplit);
  const o=S.orders.find(x=>x.id===S.cur&&x.status==='open')||null;if(o&&o.held)o.held=false;
  const others=S.orders.filter(x=>x.status==='open'&&x.type!=='dine'&&!x.splitFrom);
  let tb='';for(let n=1;n<=SET.tables;n++){const oo=openOrderFor(n);const ask=S.requests.some(r=>r.table===n);
    tb+=`<button class="tbtn${oo?' busy':''}${ask?' ask':''}${o&&oo&&o.id===oo.id?' on':''}" data-act="table" data-n="${n}"><b>Table ${n}</b><small>${oo?`${m2(totals(oo).total)}${oo.source==='qr'?', QR':''}${oo.held?', on hold':''}`:'Free'}</small></button>`;}
  tb+=others.map(x=>`<button class="tbtn busy${o&&o.id===x.id?' on':''}" data-act="selorder" data-id="${x.id}"><b>${x.type==='take'?'Takeaway':'Delivery'} #${x.no}</b><small>${m2(totals(x).total)}${x.channel?`, ${esc(x.channel)}`:''}${x.held?', on hold':''}</small></button>`).join('');
  const cats=['All',...MENU_CATS];const list=MENU().filter(m=>S.posCat==='All'||m.cat===S.posCat);

  <div class="btnrow" style="margin:-6px 0 12px"><button class="btn ghost sm" data-act="offline">${S.offline?'Internet is back':'Simulate internet down'}</button></div>
  ${S.offline?`<div class="banner offbar"><span><b>Offline.</b> The server cannot be reached. You can still take orders and payments; they wait on this device (${offlineCount()} waiting) and are sent when the connection is back. Tell the kitchen by voice or paper. Discounts, voids, splits and refunds need the server.</span></div>`:''}
  ${S.requests.map(r=>`<div class="banner">${ico('order',22)}<span>Table ${r.table} ${r.type==='paid'?`says they paid <b>${m2(r.amount)}</b> by PromptPay. Check the bank app, then confirm`:r.type==='bill'?'is asking for the bill':'is calling for staff'}, ${fmtTime(r.at)}</span><span class="btnrow">${r.type==='paid'?`<button class="btn sm" data-act="reqpaid" data-id="${r.id}">Money arrived, confirm</button>`:''}<button class="btn sm ghost" data-act="reqdone" data-id="${r.id}">${r.type==='paid'?'Not received':'Done'}</button></span></div>`).join('')}
  <section class="panel" style="margin-bottom:16px">
    <div class="poshead"><h2>Tables and open orders</h2><div class="btnrow"><button class="btn ghost sm" data-act="neworder" data-t="take">New takeaway</button><button class="btn ghost sm" data-act="neworder" data-t="delivery">New delivery</button></div></div>
    <div class="tables">${tb}</div><div class="legend"><span><i></i>Available</span><span><i style="background:var(--tint);border-color:var(--basil)"></i>Occupied</span><span><i style="background:var(--chili-tint);border-color:var(--chili)"></i>Waiting for the bill or staff</span></div>
  </section>
  <div class="pos">
    <section>
      <div class="chips">${cats.map(c=>`<button class="chip${S.posCat===c?' on':''}" data-act="poscat" data-c="${esc(c)}">${ico(c,18)}${esc(c)}</button>`).join('')}</div>
      <div class="menu-grid">${list.map(m=>{const sh=shortOf(m);return `<button class="dish" data-act="dish" data-id="${m.id}" ${m.avail?'':'disabled'}><span class="top">${ico(m.cat,34,true)}<b>${esc(m.name)}</b></span><span class="row"><span class="price">${money(m.price)}</span>${!m.avail?'<span class="tag bad">Sold out</span>':sh?`<span class="tag bad">Short on ${esc(sh)}</span>`:hasOptions(m)?'<span class="tag plain">Options</span>':''}</span></button>`;}).join('')}</div>

  </div>`;

function shortOf(m){for(const [i,q,u] of m.lines){if(I[i]&&toBase(I[i],q,u)>I[i].stock)return I[i].name;}return '';}
function orderPanel(o){

  ${o.lines.length?o.lines.map(l=>{const st=lineStatus(l);return `<div class="cline${l.void?' voided':''}"><div class="nm"><span>${l.sent?`${l.qty} × `:''}${esc(MI[l.mid].name)}</span>${modsText(l)?`<small>${esc(modsText(l))}</small>`:''}${l.note?`<small class="lnote">Note: ${esc(l.note)}</small>`:''}${l.void?`<small>${esc(l.voidReason)}, approved by ${esc(l.voidBy)}</small>`:''}
    ${!l.sent&&!l.void?`<div class="btnrow" style="margin-top:6px"><span class="qty"><button data-act="lqty" data-k="${l.k}" data-d="-1" aria-label="One less">−</button><b>${l.qty}</b><button data-act="lqty" data-k="${l.k}" data-d="1" aria-label="One more">+</button></span><button class="btn ghost sm" data-act="ledit" data-k="${l.k}">Options and note</button></div>`:`<div class="btnrow" style="margin-top:6px"><span class="tag ${ST_TAG[st]}">${ST_LABEL[st]}</span>${!l.void?`<button class="btn ghost sm" data-act="void" data-k="${l.k}">Void</button>`:''}</div>`}</div>
    <span class="amt">${l.void?'0':m2(l.unit*l.qty)}</span></div>`;}).join(''):'<p class="empty">No dishes yet. Tap a dish on the left.</p>'}
  <div class="tot"><div class="r"><span>Subtotal</span><span>${m2(t.sub)}</span></div>
    ${t.disc?`<div class="r"><span>Discount ${o.disc.type==='pct'?o.disc.val+'%':''} <small class="muted">${esc(o.disc.reason)}</small></span><span>−${m2(t.disc)}</span></div>`:''}
    ${t.svc?`<div class="r"><span>Service charge ${SET.service}%</span><span>${m2(t.svc)}</span></div>`:''}
    <div class="r muted"><span>VAT ${SET.vat}%${SET.vatIncl?', included':''}</span><span>${m2(t.vat)}</span></div>
    <div class="r big"><span>Total</span><span>${m2(t.total)}</span></div></div>
  <div class="btnrow">${o.type==='dine'&&!o.splitFrom?'<button class="btn ghost sm" data-act="movetable">Move or merge table</button>':''}${o.splitFrom?'<button class="btn ghost sm" data-act="unsplit">Back to the main bill</button>':'<button class="btn ghost sm" data-act="hold">Hold</button>'}<button class="btn ghost sm" data-act="discount" ${t.sub?'':'disabled'}>${o.disc?'Change discount':'Discount'}</button>${!anySent?'<button class="btn ghost sm" data-act="cancelorder">Cancel order</button>':''}</div>
  <div class="pay"><button class="btn ghost" data-act="send" ${unsent.length?'':'disabled'}>Send to kitchen${unsent.length?` (${sum(unsent,l=>l.qty)})`:''}</button><button class="btn" data-act="pay" ${t.count?'':'disabled'}>Take payment</button></div>
  ${unsent.length?`<details class="uses"><summary>New dishes will use</summary><ul>${uses.map(u=>`<li><span>${esc(I[u.id].name)}</span><span>${esc(u.text)}</span></li>`).join('')}</ul></details>`:''}`;
}

/* ---------- Orders & shift ---------- */
VIEWS.orders=function(){
  const sh=S.shift;const f=S.ofilter;
  const list=S.orders.filter(o=>f==='All'||o.status===f.toLowerCase()).slice().sort((a,b)=>(b.paidAt||b.created)-(a.paidAt||a.created));
  let shiftHTML;
  if(sh&&sh.open){const c=shiftCash();shiftHTML=`<h2>Shift open</h2><p class="sub keep">Opened ${fmtTime(sh.openedAt)} by ${esc(sh.by)}.</p>
    <div class="minis"><div><span>Starting cash</span><strong>${m2(sh.start)}</strong></div><div><span>Cash sales</span><strong>${m2(c.sales)}</strong></div><div><span>Cash refunds</span><strong>${m2(c.refunds)}</strong></div><div><span>Should be in drawer</span><strong>${m2(c.expected)}</strong></div><div><span>Cash in / out</span><strong>+${m2(c.cin)} / −${m2(c.cout)}</strong></div><div><span>QR, card, transfer</span><strong>${m2(c.other)}</strong></div></div>
    <div class="btnrow"><button class="btn ghost" data-act="cashmove" data-t="in">Cash in</button><button class="btn ghost" data-act="cashmove" data-t="out">Cash out</button><button class="btn ghost" data-act="xreport">X report</button><button class="btn" data-act="closeshift">Close shift and count cash</button></div>`;}
  else shiftHTML=`<h2>No shift open</h2><p class="sub">Count the cash in the drawer and open a shift before taking payments.</p><div class="formgrid" style="margin-top:10px"><label class="f">Starting cash, ฿<input id="shStart" type="number" min="0" value="2000"></label><button class="btn" data-act="openshift">Open shift</button></div>`;
  return `<header class="vh"><div><h1>Orders &amp; shift</h1><p class="sub">Every order today, its payment and status. Refunds need a manager.</p></div></header>
  <section class="panel">${shiftHTML}</section>
  ${S.shiftLog.length?`<section class="panel" style="margin-top:16px"><h2>Closed shifts</h2><p class="sub">Select a shift to see its Z report.</p><div class="tbl"><table><thead><tr><th>Opened</th><th>Closed</th><th>By</th><th class="n">Expected</th><th class="n">Counted</th><th class="n">Difference</th></tr></thead><tbody>${S.shiftLog.map(x=>`<tr class="click" data-act="zview" data-i="${S.shiftLog.indexOf(x)}"><td>${fmtTime(x.openedAt)}</td><td>${fmtTime(x.closedAt)}</td><td>${esc(x.by)}</td><td class="n">${m2(x.expected)}</td><td class="n">${m2(x.counted)}</td><td class="n ${Math.abs(x.diff)>0.009?'neg':''}">${x.diff>=0?'+':''}${m2(x.diff)}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  <section class="panel" style="margin-top:16px"><h2>Today's orders</h2>
    <div class="chips" style="margin-top:10px">${['All','Open','Paid','Refunded'].map(c=>`<button class="chip${f===c?' on':''}" data-act="ofilter" data-c="${c}">${c}</button>`).join('')}</div>
    <div class="tbl"><table><thead><tr><th>#</th><th>Time</th><th>Order</th><th class="n">Items</th><th class="n">Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>
    ${list.length?list.map(o=>{const t=tot(o);return `<tr class="click" data-act="oview" data-id="${o.id}"><td>${o.no}</td><td>${fmtTime(o.paidAt||o.created)}</td><td>${esc(orderLabel(o))}${o.source==='qr'?' <span class="tag plain">QR</span>':''}</td><td class="n">${t.count}</td><td class="n">${m2(t.total)}</td><td>${o.payments?esc([...new Set(o.payments.map(p=>p.method))].join(', '))+(o.payments.length>1?` (split ${o.payments.length})`:''):'<span class="muted">Not paid</span>'}</td><td><span class="tag ${o.status==='paid'?'':o.status==='open'?'warn':'bad'}">${o.status[0].toUpperCase()+o.status.slice(1)}</span></td></tr>`;}).join(''):'<tr><td colspan="7"><p class="empty">No orders match.</p></td></tr>'}
    </tbody></table></div></section>`;
};
function shiftData(sh,end){end=end||new Date();const inW=d=>d&&d>=sh.openedAt&&d<=end;
  const paid=S.orders.filter(o=>o.payments&&inW(o.paidAt));const meth={};paid.forEach(o=>o.payments.forEach(x=>{meth[x.method]=r2((meth[x.method]||0)+x.amount);}));
  const ref=paid.filter(o=>o.status==='refunded');const T=f=>r2(sum(paid,o=>tot(o)[f]));
  const vl=paid.flatMap(o=>o.lines.filter(l=>l.void));const top={};paid.forEach(o=>o.lines.filter(l=>!l.void).forEach(l=>{const n=MI[l.mid].name;top[n]=(top[n]||0)+l.qty;}));
  const mv=sh.moves||[];const cin=sum(mv.filter(m=>m.type==='in'),m=>m.amount),cout=sum(mv.filter(m=>m.type==='out'),m=>m.amount);
  const cashSales=meth.Cash||0,cashRef=sum(ref.filter(o=>o.refund.method==='Cash'),o=>tot(o).total);
  return {from:sh.openedAt,to:end,by:sh.by,orders:paid.length,items:sum(paid,o=>tot(o).count),gross:T('sub'),disc:T('disc'),svc:T('svc'),total:T('total'),vat:T('vat'),
    voidN:vl.length,voidV:sum(vl,l=>l.unit*l.qty),refN:ref.length,refV:sum(ref,o=>tot(o).total),meth,start:sh.start,cashSales,cashRef,cin,cout,
    expected:r2(sh.start+cashSales-cashRef+cin-cout),cash:mv.slice(),top:Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),counted:null,diff:null};}
function shiftCash(){const d=shiftData(S.shift);return {sales:d.cashSales,refunds:d.cashRef,other:r2(d.total-d.cashSales),expected:d.expected,cin:d.cin,cout:d.cout};}

  return `<div class="receipt"><div style="text-align:center"><b>${esc(SET.name)}</b><br><small>${kind==='Z'?'Z report, end of shift':'X report, shift so far'}</small><br><small>${fmtDay(d.from)}, ${fmtTime(d.from)} to ${fmtTime(d.to)}<br>Shift opened by ${esc(d.by)}</small></div><hr>
  ${r('Orders paid',d.orders)}${r('Dishes sold',d.items)}<hr>
  ${r('Sales before discount',m2(d.gross))}${r('Discounts','−'+m2(d.disc))}${d.svc?r('Service charge',m2(d.svc)):''}${r('<b>Total taken</b>','<b>'+m2(d.total)+'</b>')}${r(`VAT ${SET.vat}% inside`,m2(d.vat))}${r(`Voided dishes (${d.voidN})`,m2(d.voidV))}${r(`Refunds (${d.refN})`,'−'+m2(d.refV))}<hr>
  <b>By payment method</b>${Object.entries(d.meth).map(([k,v])=>r(esc(k),m2(v))).join('')||r('None','฿0.00')}<hr>
  <b>Cash drawer</b>${r('Starting cash',m2(d.start))}${r('Cash sales','+'+m2(d.cashSales))}${r('Cash refunds','−'+m2(d.cashRef))}${r('Cash in','+'+m2(d.cin))}${r('Cash out','−'+m2(d.cout))}${r('<b>Should be in drawer</b>','<b>'+m2(d.expected)+'</b>')}
  ${d.counted!=null?r('Counted',m2(d.counted))+r('<b>Difference</b>',`<b>${d.diff>=0?'+':''}${m2(d.diff)}</b>`,Math.abs(d.diff)>0.009?'neg':''):''}
  ${d.cash.length?`<hr><b>Cash in and out</b>${d.cash.map(c=>r(`${fmtTime(c.at)} ${esc(c.reason)}${c.note?`<br><small>${esc(c.note)}, ${esc(c.by)}</small>`:''}`,(c.type==='in'?'+':'−')+m2(c.amount))).join('')}`:''}
  ${d.top.length?`<hr><b>Top dishes</b>${d.top.map(([n,q])=>r(esc(n),q)).join('')}`:''}</div>`;}
function reportModal(d,kind){openModal(`<h2>${kind} report</h2><p class="sub">${kind==='X'?'The shift so far. Printing an X report closes nothing.':'Final figures for the closed shift. Keep it with the cash.'}</p><div style="margin-top:12px">${reportHTML(d,kind)}</div><div class="acts"><button class="btn" data-act="close">Done</button></div>`);}
function cashMoveModal(type){openModal(`<h2>${type==='in'?'Put cash in the drawer':'Take cash out of the drawer'}</h2><p class="sub">Record every cash movement that is not a sale, so the drawer still balances at the end of the shift.</p>
  <div class="form" style="margin-top:12px"><label class="f">Amount, ฿<input id="cmAmt" type="number" min="0" step="any"></label>
  <label class="f">Reason<select id="cmWhy">${(type==='in'?['Add change float','Owner put money in','Other']:['Paid a small expense','Owner withdrawal','Bank deposit','Other']).map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="f">Note<input id="cmNote" type="text" placeholder="${type==='in'?'e.g. coins from the bank':'e.g. ice from the market'}"></label>
  ${type==='out'?'<p class="sub" style="margin:0">A small expense is also added to Accounting, Expenses. Taking cash out needs a manager.</p>':''}<p id="cmErr" class="err"></p></div>
  <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="cmok" data-t="${type}">Save</button></div>`);}
function cashMoveSave(type){const amt=parseFloat($('#cmAmt').value),why=$('#cmWhy').value,note=$('#cmNote').value.trim();
  if(!(amt>0)){$('#cmErr').textContent='Enter an amount above zero.';return;}
  if(type==='out'&&amt>shiftCash().expected){$('#cmErr').textContent=`Only ${m2(shiftCash().expected)} should be in the drawer.`;return;}
  const doIt=by=>{S.shift.moves=S.shift.moves||[];S.shift.moves.push({type,amount:r2(amt),reason:why,note,by:S.user,at:new Date()});
    if(type==='out'&&why==='Paid a small expense')S.expenses.push({date:new Date(),cat:'Supplies',desc:note||'Paid from the cash drawer',amount:amt,by:S.user});
    audit(type==='in'?'Cash put in drawer':'Cash taken out of drawer',why,{after:m2(amt),reason:note,approvedBy:by});closeModal();render();toast(`${type==='in'?'Cash in':'Cash out'} ${m2(amt)} recorded.`);};
  if(type==='out'){closeModal();requireApproval(`Taking ${m2(amt)} out of the drawer`,doIt);}else doIt(S.user);}
function moveModal(){const o=curOrder();let b='';for(let n=1;n<=SET.tables;n++){if(n===o.table)continue;const oo=openOrderFor(n);b+=`<button class="tbtn${oo?' busy':''}" data-act="mvto" data-n="${n}"><b>Table ${n}</b><small>${oo?`Merge, ${m2(totals(oo).total)}`:'Free, move here'}</small></button>`;}
  openModal(`<h2>Move or merge ${esc(orderLabel(o))}</h2><p class="sub">Pick a free table to move the whole order there. Pick a busy table to merge both bills into one. Kitchen tickets follow the dishes.</p><div class="tables" style="margin-top:12px">${b}</div><div class="acts"><button class="btn ghost" data-act="close">Cancel</button></div>`,true);}
function moveTo(n){const o=curOrder();const tg=openOrderFor(n);const old=o.table;
  if(!tg){o.table=n;S.requests.forEach(r=>{if(r.table===old)r.table=n;});audit('Table moved',`Order #${o.no}`,{before:`Table ${old}`,after:`Table ${n}`});closeModal();render();toast(`Moved to Table ${n}.`);return;}
  tg.lines.push(...o.lines);S.tickets.forEach(t=>{if(t.oid===o.id)t.oid=tg.id;});if(!tg.disc&&o.disc)tg.disc=o.disc;
  S.orders.forEach(x=>{if(x.splitFrom===o.id)x.splitFrom=tg.id;});S.orders.splice(S.orders.indexOf(o),1);S.requests=S.requests.filter(r=>r.table!==old);S.cur=tg.id;
  audit('Tables merged',`Table ${old} into Table ${n}`,{before:`Order #${o.no} + #${tg.no}`,after:`Order #${tg.no}, ${m2(totals(tg).total)}`});closeModal();render();toast(`Table ${old} merged into Table ${n}.`);}
function splitModal(){const o=curOrder();if(!S.sp)S.sp={};const ls=o.lines.filter(l=>!l.void);const sel=sum(ls,l=>(S.sp[l.k]||0)*l.unit);

function splitOk(){const o=curOrder();const ls=o.lines.filter(l=>!l.void);const n=sum(ls,l=>S.sp[l.k]||0);
  if(!n){$('#spErr').textContent='Choose at least one dish.';return;}

  sendKitchen(o,true);

  o.lines.filter(l=>!l.void).forEach(l=>{const q=S.sp[l.k]||0;if(!q)return;

function unsplit(c){const par=S.orders.find(x=>x.id===c.splitFrom&&x.status==='open');if(!par){delete c.splitFrom;return;}

function kLines(t){return S.orders.flatMap(o=>o.lines).filter(l=>l.tid===t.id&&(S.kStation==='All'||MI[l.mid].station===S.kStation));}

      <h2 style="margin-top:22px">Menu cost check</h2><p class="sub">Food cost above ${SET.target}% of the price before VAT is flagged.</p>
      <div class="tbl"><table><thead><tr><th>Dish</th><th class="n">Price</th><th class="n">Cost</th><th class="n">Food cost</th><th></th></tr></thead><tbody>
      ${mrows.map(r=>`<tr${can('recipes')?` class="click" data-act="recsel" data-id="${r.m.id}"`:''}><td>${esc(r.m.name)}</td><td class="n">${money(r.m.price)}</td><td class="n">${money(r.c,2)}</td><td class="n">${pct(r.fc)}</td><td>${r.fc*100>SET.target+5?'<span class="tag bad">Review price</span>':r.fc*100>SET.target?'<span class="tag warn">Watch</span>':'<span class="tag">OK</span>'}</td></tr>`).join('')}
      </tbody></table></div></section>
  </div>`;

function priceChart(g){
  const pts=g.hist,W=600,H=250,L=56,R=40,T=30,B=200;
  const ps=pts.map(p=>p.price).concat([g.avg]);let lo=Math.min(...ps),hi=Math.max(...ps);const pad=(hi-lo)*0.3||hi*0.06;lo-=pad;hi+=pad;
  const t0=pts[0].date.getTime(),t1=pts[pts.length-1].date.getTime();
  const X=t=>L+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-L-R),Y=p=>B-(p-lo)/(hi-lo)*(B-T);
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history of ${esc(g.name)}">`;
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);o+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${money(v)}</text>`;}
  o+=`<line x1="${L}" x2="${W-R}" y1="${Y(g.avg)}" y2="${Y(g.avg)}" stroke="var(--muted)" stroke-dasharray="5 5"/>`;
  o+=`<polyline fill="none" stroke="var(--bar)" stroke-width="2.5" points="${pts.map(p=>X(p.date.getTime())+','+Y(p.price)).join(' ')}"/>`;
  pts.forEach((p,i)=>{const x=X(p.date.getTime()),y=Y(p.price);const up=i>0&&p.price>pts[i-1].price*1.0999;
    o+=`<circle cx="${x}" cy="${y}" r="5" fill="${up?'var(--chili)':'var(--bar)'}" stroke="var(--surface)" stroke-width="2"/><text x="${x}" y="${y-12}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${money(p.price,p.price%1?2:0)}</text><text x="${x}" y="${B+22}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${fmtDate(p.date)}</text>`;});
  return o+'</svg>';
}

      </tbody></table></div><p class="sub" style="margin-top:10px">Suggested amounts cover the delivery time plus 7 days, plus 2 days of safety stock.</p></section>`;}
  if(tab==='plan')body=planHTML();
  if(tab==='waste')body=wasteHTML();
  if(tab==='menu')body=menuPerfHTML();
  return `<header class="vh"><div><h1>Intelligence</h1><p class="sub">Forecasts, restock suggestions, waste and menu performance, worked out from this restaurant's own sales and stock.</p></div></header>
  <div class="tabs">${F_TABS.map(([k,l])=>`<button class="${S.fTab===k?'on':''}" data-act="ftab" data-c="${k}">${l}</button>`).join('')}</div>${body}`;
};
function planRows(){return ING().filter(g=>g.type==='raw').map(g=>({g,f:forecast(g.id)})).filter(x=>x.f.simple>0).map(x=>Object.assign(x,{rec:Math.max(0,Math.ceil((x.f.needH+x.f.safety-x.g.stock)/x.g.buy.factor))})).filter(x=>x.rec>0).sort((a,b)=>a.f.early-b.f.early);}
function planHTML(){const rows=planRows();if(!S.plan)S.plan=Object.fromEntries(rows.map(x=>[x.g.id,x.f.status[0]!=='ok']));const ok=['owner','manager'].includes(S.role);
  return `<section class="panel"><h2>Restock plan</h2><p class="sub">Order = expected use during the delivery time plus 7 days, plus 2 days of safety stock, minus what is in stock, rounded up to whole buying units. Tick what to order; one draft PO is made per supplier for a manager to approve.</p>
  <div class="tbl"><table><thead><tr><th></th><th>Item</th><th class="n">In stock</th><th class="n">Use, delivery + 7 days</th><th class="n">Safety stock</th><th class="n">Order</th><th>Supplier</th><th class="n">Cost</th><th></th></tr></thead><tbody>
  ${rows.length?rows.map(x=>`<tr><td><input type="checkbox" class="planck" data-id="${x.g.id}"${S.plan[x.g.id]?' checked':''} aria-label="Order ${esc(x.g.name)}"></td><td>${esc(x.g.name)}</td><td class="n">${fmtBase(x.g,x.g.stock)}</td><td class="n">${fmtBase(x.g,x.f.needH)}</td><td class="n">${fmtBase(x.g,x.f.safety)}</td><td class="n"><b>${x.rec} ${esc(x.g.buy.label)}</b></td><td>${esc(x.g.sup)}</td><td class="n">${money(x.rec*quoteOf(x.g.id,x.g.sup))}</td><td><span class="tag ${x.f.status[0]}">${x.f.status[1]}</span></td></tr>`).join(''):'<tr><td colspan="9"><p class="empty">Nothing needs ordering right now.</p></td></tr>'}</tbody></table></div>
  ${rows.length&&ok?'<div class="btnrow" style="margin-top:12px"><button class="btn" data-act="plancreate">Create draft purchase orders</button></div>':''}</section>`;}
function wasteHTML(){const from=addDays(today,-6);const ws=S.moves.filter(m=>(m.type==='WASTAGE'||m.type==='EXPIRED')&&m.at>=from&&m.delta<0&&I[m.id]);
  const val=m=>-m.delta*valPerBase(I[m.id]);const total=sum(ws,val);const byCat={},byWhy={};
  ws.forEach(m=>{const c=I[m.id].cat;byCat[c]=(byCat[c]||0)+val(m);const r=m.reason||m.type;byWhy[r]=(byWhy[r]||0)+val(m);});
  const bars=(obj,fmt)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));return `<div class="bars">${e.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(v/mx*100).toFixed(1)}%"></span></span><span style="text-align:right">${fmt(v)}</span></div>`).join('')}</div>`;};
  const fc=sum(S.hist.slice(-6),h=>h.cost)+sum(paidToday(),orderCost);
  return `<div class="minis"><div><span>Wasted, last 7 days</span><strong>${money(total)}</strong></div><div><span>Records</span><strong>${ws.length}</strong></div><div><span>Compared with food cost</span><strong>${pct(fc?total/fc:0)}</strong></div></div>
  <div class="split"><section class="panel"><h2>By category, ฿</h2>${ws.length?bars(byCat,v=>money(v)):'<p class="empty">No waste recorded.</p>'}</section><section class="panel"><h2>Why it was wasted</h2>${ws.length?bars(byWhy,v=>pct(v/total)):'<p class="empty">No waste recorded.</p>'}</section></div>
  <section class="panel" style="margin-top:18px"><h2>Waste records</h2><div class="tbl"><table><thead><tr><th>When</th><th>Item</th><th class="n">Amount</th><th>Reason</th><th>By</th><th class="n">Value</th></tr></thead><tbody>${ws.slice().sort((a,b)=>b.at-a.at).map(m=>`<tr><td>${fmtDate(m.at)}</td><td>${esc(I[m.id].name)}</td><td class="n">${fmtBase(I[m.id],-m.delta)}</td><td>${esc(m.reason||m.type)}</td><td>${esc(m.by)}</td><td class="n">${money(val(m))}</td></tr>`).join('')||'<tr><td colspan="6"><p class="empty">No waste recorded.</p></td></tr>'}</tbody></table></div></section>`;}
function menuPerfHTML(){const rows=MENU().map(m=>{const q=(S.sold30[m.id]||0)+sum(paidToday(),o=>sum(o.lines.filter(l=>l.mid===m.id&&!l.void),l=>l.qty));const unit=m.price-vatOf(m.price)-menuCost(m);return {m,q,rev:q*m.price,profit:q*unit,unit};}).filter(r=>r.q>0);
  if(!rows.length)return '<p class="empty">No sales yet.</p>';
  const aq=sum(rows,r=>r.q)/rows.length,au=sum(rows,r=>r.unit)/rows.length;
  const cls=r=>r.q>=aq&&r.unit>=au?['','Star','Popular and profitable']:r.q>=aq?['warn','Workhorse','Popular, low profit per plate']:r.unit>=au?['plain','Puzzle','Profitable, sells little']:['bad','Weak','Sells little, low profit'];
  rows.sort((a,b)=>b.profit-a.profit);
  return `<section class="panel"><h2>Menu performance, last 30 days</h2><p class="sub keep">Each dish is compared with the menu average: ${trim(aq)} plates sold and ${money(au,2)} profit per plate (price before VAT minus food cost). Workhorses may take a small price rise; weak dishes are candidates to drop or rework.</p>
  <div class="tbl"><table><thead><tr><th>Dish</th><th class="n">Sold</th><th class="n">Revenue</th><th class="n">Profit per plate</th><th class="n">Gross profit</th><th></th></tr></thead><tbody>${rows.map(r=>{const c=cls(r);return `<tr><td><div class="nm-i">${ico(r.m.cat,26,true)}${esc(r.m.name)}</div></td><td class="n">${r.q.toLocaleString('en-US')}</td><td class="n">${money(r.rev)}</td><td class="n">${money(r.unit,2)}</td><td class="n">${money(r.profit)}</td><td><span class="tag ${c[0]}">${c[1]}</span> <small style="display:inline">${c[2]}</small></td></tr>`;}).join('')}</tbody></table></div></section>`;}
function fcChart(g,f){
  const past=S.hist.slice(-28).map(h=>({d:h.date,v:h.usage[g.id]||0,fut:false}));const fut=f.next.slice(0,8).map(x=>({d:x.d,v:x.v,fut:true}));
  const all=past.concat(fut);const max=Math.max(1,...all.map(a=>a.v));
  const div=g.unit==='pc'?1:(max>=2000?1000:1);const ul=g.unit==='pc'?'pcs':div===1000?(g.unit==='g'?'kg':'L'):g.unit;
  const W=680,H=230,L=48,R=12,T=24,B=186,bw=(W-L-R)/all.length;
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily use of ${esc(g.name)}, past 4 weeks and next week">`;
  for(let k=0;k<=2;k++){const v=max*k/2,y=B-v/max*(B-T);o+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${trim(v/div)}</text>`;}
  o+=`<text x="${L-8}" y="${T-10}" text-anchor="end" font-size="11.5" fill="var(--muted)">${ul}</text>`;
  all.forEach((a,i)=>{const x=L+i*bw+1.5,w=Math.max(2,bw-3),h=a.v/max*(B-T);
    o+=a.fut?`<rect x="${x}" y="${B-h}" width="${w}" height="${h}" rx="2" fill="var(--bar)" fill-opacity="0.18" stroke="var(--bar)" stroke-dasharray="3 2"/>`:`<rect x="${x}" y="${B-h}" width="${w}" height="${h}" rx="2" fill="var(--bar2)"/>`;
    if(i%7===0||i===past.length)o+=`<text x="${x+w/2}" y="${B+18}" text-anchor="middle" font-size="11.5" fill="${i===past.length?'var(--ink)':'var(--muted)'}" font-weight="${i===past.length?600:400}">${i===past.length?'Today':fmtDate(a.d)}</text>`;});
  const tx=L+past.length*bw;
  o+=`<line x1="${tx}" x2="${tx}" y1="${T-6}" y2="${B}" stroke="var(--ink)" stroke-dasharray="4 4"/><text x="${tx+6}" y="${T}" font-size="11.5" fill="var(--muted)">Forecast</text><text x="${tx-6}" y="${T}" text-anchor="end" font-size="11.5" fill="var(--muted)">Actual use</text>`;
  return o+`<line x1="${L}" x2="${W-R}" y1="${B}" y2="${B}" stroke="var(--line)"/></svg>`;
}

    body=`<div class="split"><section class="panel"><h2>Fixed monthly costs</h2><p class="sub">Spread evenly over each day in the profit and loss.</p>

      <tr><td><b>Total per month</b></td><td class="n"><b>${money(sum(FIXED,f=>f[1]))}</b></td></tr></tbody></table></div></section>
      <section class="panel"><h2>Add an expense</h2><div class="formgrid" style="margin-top:10px">
        <label class="f">Date<input id="exDate" type="date" value="${iso(new Date())}"></label>

/* ================= customer payment, tax invoice, offline, table QR, Excel ================= */
function offlineCount(){return S.orders.filter(o=>o.offline).length;}
function custPayModal(){const o=openOrderFor(S.ctable);if(!o){toast('Nothing to pay yet.');return;}const amt=totals(o).total;
  openModal(`<h2>Pay ${m2(amt)}</h2><p class="sub">Open your banking app and scan this code. The amount is already filled in. Then tap "I have paid"; staff check and confirm.</p><div style="margin-top:10px">${qrSVG(amt)}</div>
  <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="cpaid" data-a="${amt}">I have paid</button></div>`);}
function taxInvModal(id){const o=S.orders.find(x=>String(x.id)===String(id));if(o.invoice)return invoiceView(o);
  openModal(`<h2>Full tax invoice, order #${o.no}</h2><p class="sub">For company customers (ใบกำกับภาษีเต็มรูป). Numbered in sequence, one per order.</p>
  <div class="form" style="margin-top:12px"><label class="f">Company or name<input id="ti_name"></label><label class="f">Tax ID, 13 digits<input id="ti_tax" inputmode="numeric" maxlength="13"></label>
  <label class="f">Branch<input id="ti_branch" value="Head office"></label><label class="f">Address<input id="ti_addr"></label><p id="tiErr" class="err"></p></div>
  <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="taxok" data-id="${id}">Issue tax invoice</button></div>`);}
function invoiceView(o){const t=tot(o),inv=o.invoice;
  openModal(`<h2>Tax invoice ${esc(inv.no)}</h2><div class="invoice" style="margin-top:10px"><b>Tax invoice / ใบกำกับภาษี</b><br>No. ${esc(inv.no)}, ${fmtDay(inv.at)}
  <div class="grid2" style="margin-top:10px"><div><b>Seller</b><br>${esc(SET.name)}<br>${esc(SET.address)}<br>Tax ID ${esc(SET.taxId)} (Head office)</div><div><b>Buyer</b><br>${esc(inv.name)}<br>${esc(inv.addr)}<br>Tax ID ${esc(inv.tax)} (${esc(inv.branch)})</div></div>
  <table style="margin-top:10px"><tbody>${o.lines.filter(l=>!l.void).map(l=>`<tr><td>${l.qty} × ${esc(MI[l.mid].name)}</td><td class="n">${m2(l.unit*l.qty)}</td></tr>`).join('')}
  ${t.disc?`<tr><td>Discount</td><td class="n">−${m2(t.disc)}</td></tr>`:''}<tr><td>Value before VAT</td><td class="n">${m2(t.total-t.vat)}</td></tr><tr><td>VAT ${SET.vat}%</td><td class="n">${m2(t.vat)}</td></tr><tr><td><b>Total</b></td><td class="n"><b>${m2(t.total)}</b></td></tr></tbody></table></div>
  <div class="acts"><button class="btn" data-act="close">Done</button></div>`,true);}
function tableQrHTML(){const base=location.href.split('#')[0];let cards='';
  for(let n=1;n<=SET.tables;n++){const svg=realQR(`${base}#t=${n}`);cards+=`<div class="qrcard"><b>Table ${n}</b><div>${svg||'<p class="sub">QR needs internet to draw</p>'}</div><small class="muted">Scan to order and pay</small></div>`;}
  return `<section class="panel"><h2>Payments and receipts</h2><div class="formgrid" style="margin-top:8px"><label class="f">PromptPay number (mobile or 13-digit tax ID)<input data-st="promptpay" value="${esc(SET.promptpay)}" inputmode="numeric"></label>
    <label class="f">Address on receipts and tax invoices<input data-st="address" value="${esc(SET.address)}"></label></div>
    <p class="sub">The PromptPay QR on the till and on customers' phones uses this number.</p></section>
  <section class="panel" style="margin-top:18px"><h2>Table QR codes</h2><p class="sub">Print these for the tables.</p><div class="qrgrid" style="margin-top:12px">${cards}</div></section>`;}
function exportXlsx(){if(!window.XLSX){toast('Excel needs internet to load. Use the CSV buttons instead.');return;}
  const paid=S.orders.filter(o=>o.status==='paid'||o.status==='refunded');const wb=XLSX.utils.book_new();
  const clean=r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,typeof v==='number'&&!isFinite(v)?'':v]));
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows.map(clean):[{Note:'Nothing yet'}]),name);
  add('Sales today',paid.map(o=>{const t=tot(o);return {Order:o.no,'Paid at':fmtTime(o.paidAt),Order_label:orderLabel(o),Source:o.source||'staff',Status:o.status,Subtotal:t.sub,Discount:t.disc,VAT:t.vat,Total:t.total,Cashier:o.by||''};}));
  add('Dishes sold',paid.flatMap(o=>o.lines.map(l=>({Order:o.no,Dish:MI[l.mid].name,Qty:l.qty,'Price each':l.unit,Amount:l.void?0:l.unit*l.qty,'Food cost':r2(l.cost||0),Voided:l.void?'yes':''}))));
  add('Payments',paid.flatMap(o=>(o.payments||[]).map(p=>({Order:o.no,Method:p.method,Amount:p.amount}))));
  add('Sales by day',S.hist.map(h=>({Date:iso(h.date),Orders:h.orders,Sales:r2(h.rev),'Food cost':r2(h.cost)})));
  add('Stock now',ING().map(g=>({Item:g.name,Category:g.cat,'In stock':r2(g.stock),Unit:g.unit,'Average cost':r2(g.type==='pre'?unitCost(g):g.avg),'Buying unit':g.buy.label,Value:r2(Math.max(0,g.stock)*valPerBase(g))})));
  add('Stock movements',S.moves.slice(-2000).map(m=>({Time:fmtDay(m.at)+' '+fmtTime(m.at),Item:I[m.id]?I[m.id].name:m.id,Change:r2(m.delta),Type:m.type,Reference:m.ref,By:m.by})));
  add('Expenses',S.expenses.map(e=>({Date:iso(e.date),Category:e.cat,'What for':e.desc,Amount:e.amount})));
  add('Audit log',S.audit.map(a=>({Time:fmtDay(a.at)+' '+fmtTime(a.at),Who:a.user,Action:a.action,What:a.detail,Before:a.before||'',After:a.after||'',Reason:a.reason||''})));
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile(`laphetyay-${iso(new Date())}.xlsx`,new Uint8Array(out),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}

/* ================= modals ================= */
function openModal(html,wide){const m=$('#modal');m.innerHTML=`<div class="mbox${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;const f=m.querySelector('input:not([type=hidden]),select,button');if(f)f.focus();}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';S.md=null;S.pm=null;S.dm=null;}
let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},2800);}

// dish options
function modsModal(){const d=S.md,m=MI[d.mid];const unit=linePrice({mid:d.mid,mods:d.mods});
  const grp=(title,inner)=>`<div class="optgrp"><h3>${title}</h3><div class="opts">${inner}</div></div>`;
  let h=`<div class="nm-i">${ico(m.cat,44,true)}<div><h2>${esc(m.name)}</h2><span class="muted">${money(m.price)}</span></div></div>`;
  if(d.mods.spice!=null)h+=grp('Spice level',SPICE.map((s,i)=>`<button class="opt${d.mods.spice===i?' on':''}" data-act="mdopt" data-g="spice" data-v="${i}">${s}</button>`).join(''));
  if(d.mods.sweet!=null)h+=grp('Sweetness',SWEET.map((s,i)=>`<button class="opt${d.mods.sweet===i?' on':''}" data-act="mdopt" data-g="sweet" data-v="${i}">${s}</button>`).join(''));
  if(d.mods.ice!=null)h+=grp('Ice',ICE.map((s,i)=>`<button class="opt${d.mods.ice===i?' on':''}" data-act="mdopt" data-g="ice" data-v="${i}">${s}</button>`).join(''));
  const ex=extrasFor(m);if(ex.length)h+=grp('Add extra',ex.map(e=>`<button class="opt${d.mods.extras.includes(e.id)?' on':''}" data-act="mdopt" data-g="extras" data-v="${e.id}">${esc(e.name)} +${money(e.price)}</button>`).join(''));
  const rm=removablesFor(m);if(rm.length)h+=grp('Leave out',rm.map(i=>`<button class="opt${d.mods.remove.includes(i)?' on':''}" data-act="mdopt" data-g="remove" data-v="${i}">No ${esc(I[i].name.split(',')[0].toLowerCase())}</button>`).join(''));
  h+=`<div class="optgrp"><h3>Note for the kitchen</h3><input id="mdNote" type="text" value="${esc(d.note)}" placeholder="e.g. sauce on the side"></div>
  <div class="optgrp"><h3>Quantity</h3><div class="qty"><button data-act="mdqty" data-d="-1" aria-label="One less">−</button><b>${d.qty}</b><button data-act="mdqty" data-d="1" aria-label="One more">+</button></div></div>
  <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="mdsave">${d.key?'Save changes':'Add to order'}, ${m2(unit*d.qty)}</button></div>`;
  openModal(h);}
function startMods(mid,key,target){const m=MI[mid];
  if(key){const list=target==='cust'?S.ccart:curOrder().lines;const l=list.find(x=>x.k===key);S.md={mid,key,target,qty:l.qty,mods:JSON.parse(JSON.stringify(l.mods)),note:l.note};}
  else S.md={mid,key:null,target,qty:1,mods:defMods(m),note:''};
  if(!key&&!hasOptions(m)){mdSave();return;}

function ppPayload(id,satang){const f=(i,v)=>i+String(v.length).padStart(2,'0')+v;const d=String(id).replace(/\D/g,'');
  const target=d.length>=13?f('02',d):f('01',('0000000000000'+d.replace(/^0/,'66')).slice(-13));
  const body=f('00','01')+f('01',satang?'12':'11')+f('29',f('00','A000000677010111')+target)+f('58','TH')+f('53','764')+(satang?f('54',(satang/100).toFixed(2)):'')+'6304';
  let c=0xffff;for(const ch of body){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xffff:(c<<1)&0xffff;}return body+c.toString(16).toUpperCase().padStart(4,'0');}
function realQR(text){try{if(!window.qrcode)return null;const q=window.qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){return null;}}
function qrSVG(amount){const svg=SET.promptpay?realQR(ppPayload(SET.promptpay,Math.round(amount*100))):null;
  if(svg)return `<div class="qr">${svg.replace('<svg ','<svg width="180" height="180" role="img" aria-label="PromptPay QR code" ')}<b>${m2(amount)}</b><span>PromptPay ${esc(SET.promptpay)}</span></div>`;
  return fakeQR(amount);}
function fakeQR(amount){let s=Math.floor(amount*100)+7;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};let cells='';
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(f){const ex=x>13?x-14:x,ey=y>13?y-14:y;const on=ex===0||ex===6||ey===0||ey===6||(ex>1&&ex<5&&ey>1&&ey<5);if(on)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}else if(r()<0.48)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<div class="qr"><svg viewBox="-1 -1 23 23" width="168" height="168" fill="#16201B" role="img" aria-label="Demo payment QR code">${cells}</svg><b>${m2(amount)}</b><span>PromptPay demo code, not a real payment</span></div>`;}

  else{if(p.method==='Cash'&&p.split===1){const tend=parseFloat(p.tendered);if(!(tend>=t.total)){$('#pmErr').textContent=`Cash received must be at least ${m2(t.total)}.`;return;}o.tendered=tend;o.change=r2(tend-t.total);}
  const each=r2(t.total/p.split);o.payments=Array.from({length:p.split},(_,i)=>({method:p.method,amount:i===p.split-1?r2(t.total-each*(p.split-1)):each}));}
  o.t=t;o.status='paid';o.paidAt=new Date();o.by=S.user;if(S.offline)o.offline=true;S.requests=S.requests.filter(r=>!(o.type==='dine'&&r.table===o.table));
  pushFeed({time:new Date(),title:`Order #${o.no} paid, ${orderLabel(o)}`,amount:t.total,meta:`${p.method==='Mixed'?o.payments.map(x=>`${x.method} ${m2(x.amount)}`).join(' + '):p.method}${p.split>1&&p.method!=='Mixed'?`, split ${p.split} ways`:''}${o.change?`, change ${m2(o.change)}`:''}`,lines:[]});

function cookSave(id){const g=I[id];const n=parseInt($('#cookN').value,10);const out=parseFloat($('#cookOut').value)*1000;

  if(sh){$('#cookErr').textContent=`Not enough ${I[sh[0]].name.toLowerCase()}. Receive more stock or make fewer batches.`;return;}
  const bn=bno(g);const exp=addDays(today,g.shelf||1);const lines=[];
  for(const [i,q,u] of g.batch.lines){const b=toBase(I[i],q,u)*n;move(i,-b,'PRODUCTION',bn);lines.push({name:I[i].name,val:'−'+((u==='tsp'||u==='tbsp')?`${nice(q*n)} ${u} (${fmtBase(I[i],b)})`:fmtBase(I[i],b))});}

function doReceive(g,q,p,sup,exp,ref){const oq=Math.max(0,g.stock)/g.buy.factor,na=(oq*g.avg+q*p)/(oq+q);const oldAvg=g.avg,prev=g.last;
